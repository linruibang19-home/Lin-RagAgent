server:
  port: ${PORT:${SERVER_PORT:9082}}

spring:
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:super_agent_business_chat}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=false&sslMode=${MYSQL_SSL_MODE:REQUIRED}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-256}
      sasl.jaas.config: 'org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_SASL_USERNAME}" password="${KAFKA_SASL_PASSWORD}";'
  ai:
    openai:
      api-key: ${ALI_BAI_LIAN_API_KEY}
      embedding:
        api-key: ${ALI_BAI_LIAN_API_KEY}

app:
  web:
    cors:
      allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:https://*.vercel.app,https://kuritian.online,https://www.kuritian.online}
  admin-auth:
    username: ${SUPER_AGENT_ADMIN_USERNAME}
    password: ${SUPER_AGENT_ADMIN_PASSWORD}
    token-secret: ${SUPER_AGENT_ADMIN_TOKEN_SECRET}
    token-expire-minutes: ${SUPER_AGENT_ADMIN_TOKEN_EXPIRE_MINUTES:720}
  tavily:
    enabled: ${TAVILY_ENABLED:true}
    api-key: ${TAVILY_API_KEY}
  manage:
    minio:
      endpoint: ${MINIO_ENDPOINT}
      access-key: ${MINIO_ACCESS_KEY}
      secret-key: ${MINIO_SECRET_KEY}
      bucket-name: ${MINIO_BUCKET_NAME:lin-ragagent-document}
    kafka:
      auto-create-topics: ${KAFKA_AUTO_CREATE_TOPICS:false}
    pgvector:
      host: ${PGVECTOR_HOST}
      port: ${PGVECTOR_PORT:5432}
      database: ${PGVECTOR_DATABASE:super_agent_pgvector}
      username: ${PGVECTOR_USERNAME}
      password: ${PGVECTOR_PASSWORD}
      ssl-mode: ${PGVECTOR_SSLMODE:require}
    elasticsearch:
      enabled: ${ELASTICSEARCH_ENABLED:true}
      client-type: ${ELASTICSEARCH_CLIENT_TYPE:opensearch}
      uris:
        - ${ELASTICSEARCH_URI}
      username: ${ELASTICSEARCH_USERNAME}
      password: ${ELASTICSEARCH_PASSWORD}
    neo4j:
      enabled: ${NEO4J_ENABLED:true}
      uri: ${NEO4J_URI}
      username: ${NEO4J_USERNAME}
      password: ${NEO4J_PASSWORD}
      database: ${NEO4J_DATABASE:neo4j}

management:
  health:
    neo4j:
      enabled: false
  endpoint:
    health:
      show-details: when_authorized
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  level:
    org.springframework.ai: INFO
    com.alibaba.cloud.ai: INFO
    org.Lin.ai.chatagent: INFO
    org.Lin.ai.manage: INFO
